org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Backend URL. Override per machine in ~/.gradle/gradle.properties or with -Pvaultchat.apiBaseUrl=...
# Debug default reaches a backend on the development machine from the Android emulator.
vaultchat.apiBaseUrl.debug=http://10.0.2.2:3000/
# Release builds must use HTTPS. The .invalid placeholder never resolves, so a release built
# without a real URL cannot talk to anything by accident.
vaultchat.apiBaseUrl.release=https://api.example.invalid/
