# Production service layout (docs/16-deployment-and-operations.md §2, §5–§8, §11). It lives at the
# repository root because Coolify runs compose with the repo root as the project directory, and
# build paths are resolved from there. Coolify (or `docker compose`) supplies every secret through
# the environment; nothing secret is in this file. Routing (D-18, one domain) is configured in
# Coolify: <domain>/rtc → livekit:7880 (path kept: the LiveKit SDK connects to <url>/rtc), every
# other path → backend:3000.
#
#   docker compose -f docker-compose.prod.yml up -d
#
# `up` runs `migrate` first (migrations, then role grants as vc_migrate) and starts the backend only
# if it succeeded. LiveKit's whole config is in this file (LIVEKIT_CONFIG): no file on the server.
#
# PostgreSQL is a Coolify database resource on the same Docker network, never published.

name: vaultchat

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-hardening: &hardening
  read_only: true
  tmpfs: ["/tmp"]
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]

services:
  backend:
    build: { context: ./backend, target: runtime }
    image: vaultchat-backend
    restart: unless-stopped
    <<: *hardening
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      # Inside the container the admin listener must bind all interfaces; the port mapping below
      # publishes it on the VPS loopback only (reach it through an SSH tunnel, D-05).
      ADMIN_HOST: 0.0.0.0
      ADMIN_PORT: "3001"
      TRUST_PROXY: ${TRUST_PROXY:?Traefik network CIDR}
      DATABASE_URL: ${DATABASE_URL:?app role connection string}
      ADMIN_TOTP_ENC_KEY: ${ADMIN_TOTP_ENC_KEY:?32 random bytes, base64}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:?wss://rtc.<domain>}
      LIVEKIT_API_URL: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?}
      # Optional: path of the mounted Firebase service-account file (read-only secret mount).
      FCM_CREDENTIALS_FILE: ${FCM_CREDENTIALS_FILE:-}
      # The backup job's status file, shown on the Admin Console health page.
      BACKUP_STATUS_FILE: /backups/last-success
    volumes:
      - vaultchat-backups:/backups:ro
    ports:
      - "127.0.0.1:3001:3001"
    # The database is a separate Coolify resource on the `coolify` network.
    networks: [default, coolify]
    logging: *logging

  migrate:
    # One-shot on every `up`: `prisma migrate deploy`, then prisma/grants.sql (idempotent).
    build: { context: ./backend, target: migrate }
    image: vaultchat-migrate
    restart: "no"
    <<: *hardening
    environment:
      # Schema-owning role (docs/13 §1); never the app role.
      MIGRATE_DATABASE_URL: ${MIGRATE_DATABASE_URL:?migration role connection string}
    # The database is a separate Coolify resource on the `coolify` network.
    networks: [default, coolify]
    logging: *logging

  audit-retention:
    # Daily scheduled task: `docker compose ... --profile maint run --rm audit-retention`.
    # Runs with the maintenance role only (DELETE on audit_events); it never holds the app's secrets.
    profiles: ["maint"]
    image: vaultchat-backend
    <<: *hardening
    command: ["node", "dist/cli.js", "maint:purge-audit"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${MAINT_DATABASE_URL:?maintenance role connection string}
    # The database is a separate Coolify resource on the `coolify` network.
    networks: [default, coolify]
    logging: *logging

  livekit:
    image: livekit/livekit-server:v1.13.7   # pinned; read release notes before changing
    restart: unless-stopped
    <<: *hardening
    environment:
      LIVEKIT_KEYS: ${LIVEKIT_KEYS:?format is key colon space secret}
      # The whole server config (read by livekit-server from LIVEKIT_CONFIG; flag `config-body`,
      # cmd/server/main.go v1.13.7, checked 2026-10-27). No secrets: the key/secret pair is LIVEKIT_KEYS;
      # the webhook names the key only. docs/08-calling.md §13, docs/16 §8.
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: true
        room:
          auto_create: false
          max_participants: 2
          empty_timeout: 60
          departure_timeout: 20
        webhook:
          api_key: ${LIVEKIT_API_KEY:?}
          urls:
            - http://backend:3000/internal/livekit/webhook
        logging:
          level: info
    ports:
      - "7881:7881/tcp"   # ICE over TCP
      - "7882:7882/udp"   # media (UDP mux)
      - "3478:3478/udp"   # embedded TURN/UDP (only if enabled, docs/16 §8.3)
    # Routing for <domain>/rtc → LiveKit signalling (port 7880), path kept: the LiveKit SDK connects to
    # <url>/rtc. Written here because Coolify's domain field cannot express a path plus a port (it read
    # "/rtc:7880" as the path, stripped it, and picked port 7881). Leave the livekit domain EMPTY in
    # Coolify. Names (entrypoint "https", resolver "letsencrypt", proxy on the "coolify" network) match
    # the labels Coolify generates for the backend. The longer rule outranks the backend's catch-all.
    networks: [default, coolify]
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.vaultchat-rtc.rule=Host(`${PUBLIC_DOMAIN:-fluteconsulatancy.com}`) && PathPrefix(`/rtc`)
      - traefik.http.routers.vaultchat-rtc.entrypoints=https
      - traefik.http.routers.vaultchat-rtc.tls=true
      - traefik.http.routers.vaultchat-rtc.tls.certresolver=letsencrypt
      - traefik.http.routers.vaultchat-rtc.priority=1000
      - traefik.http.routers.vaultchat-rtc.service=vaultchat-rtc
      - traefik.http.services.vaultchat-rtc.loadbalancer.server.port=7880
    logging: *logging

  backup:
    # Run by a scheduled task (e.g. Coolify): `docker compose ... run --rm backup`.
    profiles: ["backup"]
    build: { context: ./deploy/backup }
    image: vaultchat-backup
    <<: *hardening
    environment:
      PGHOST: ${BACKUP_PGHOST:?}
      PGPORT: ${BACKUP_PGPORT:-5432}
      PGDATABASE: ${BACKUP_PGDATABASE:?}
      PGUSER: ${BACKUP_PGUSER:?read-only maintenance role}
      PGPASSWORD: ${BACKUP_PGPASSWORD:?}
      AGE_RECIPIENT: ${AGE_RECIPIENT:?age public key; private key kept offline}
      BACKUP_DIR: /backups
    volumes:
      - vaultchat-backups:/backups
    # The database is a separate Coolify resource on the `coolify` network.
    networks: [default, coolify]
    logging: *logging

volumes:
  vaultchat-backups:

networks:
  # Coolify's shared network, where its PostgreSQL resource lives (created by Coolify; `docker
  # network create coolify` to run this file elsewhere). Services that use the database join it.
  coolify:
    external: true
