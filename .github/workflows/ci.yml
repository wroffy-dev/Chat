name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Throwaway CI database; not a real credential.
          POSTGRES_USER: vaultchat
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: vaultchat_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vaultchat -d vaultchat_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://vaultchat:ci-only-password@localhost:5432/vaultchat_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # GitHub-hosted Ubuntu runners include the Android SDK (ANDROID_HOME is preset).
      - run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
      # Unsigned release build with a placeholder URL: checks that R8 shrinking works with the
      # libraries in use. No signing material exists in CI.
      - run: ./gradlew --no-daemon :app:assembleRelease -Pvaultchat.apiBaseUrl.release=https://api.example.invalid/

  repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-secrets.sh

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend runtime, migrate and backup images
        run: |
          docker build --target runtime -t vaultchat-backend backend
          docker build --target migrate -t vaultchat-migrate backend
          docker build -t vaultchat-backup deploy/backup
      - name: Runtime image runs as non-root and carries no tests or env files
        run: |
          test "$(docker run --rm --entrypoint id vaultchat-backend -u)" != 0
          docker run --rm --entrypoint sh vaultchat-backend -c 'test ! -e /app/test && test ! -e /app/.env && test ! -e /app/src'
          docker run --rm --entrypoint sh vaultchat-backup -c 'age --version && pg_dump --version && test "$(id -u)" != 0'
      - name: Runtime image starts without a database (liveness up, readiness down)
        run: |
          docker run -d --name backend -p 127.0.0.1:3000:3000 \
            -e NODE_ENV=production \
            -e DATABASE_URL=postgresql://ci:ci-only-password@127.0.0.1:1/none \
            -e ADMIN_TOTP_ENC_KEY="$(openssl rand -base64 32)" \
            vaultchat-backend
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:3000/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/readyz)" = 503
          docker logs backend 2>&1 | tail -20
          docker rm -f backend
      - name: Production compose template is valid
        env:
          TRUST_PROXY: 10.0.0.0/8
          DATABASE_URL: postgresql://app:ci-only-password@db:5432/vc
          MIGRATE_DATABASE_URL: postgresql://migrate:ci-only-password@db:5432/vc
          ADMIN_TOTP_ENC_KEY: placeholder
          LIVEKIT_PUBLIC_URL: wss://rtc.example.test
          LIVEKIT_API_KEY: placeholder
          LIVEKIT_API_SECRET: placeholder
          LIVEKIT_KEYS: "placeholder: placeholder"
          BACKUP_PGHOST: db
          BACKUP_PGDATABASE: vc
          BACKUP_PGUSER: maint
          BACKUP_PGPASSWORD: placeholder
          AGE_RECIPIENT: placeholder
          MAINT_DATABASE_URL: postgresql://maint:ci-only-password@db:5432/vc
        run: docker compose -f deploy/docker-compose.prod.yml --profile migrate --profile backup --profile maint config -q

  database-roles:
    # 24.04 ships the PostgreSQL 16 client; newer images only carry newer majors.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Throwaway CI superuser; not a real credential.
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # pg_dump must match the server's major (16), as in the backup image: a newer client writes
      # settings (e.g. transaction_timeout) that a 16 server rejects on restore.
      - run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends age postgresql-client-16
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - run: pg_dump --version | grep -q ' 16\.'
      - run: npm ci && npm run build
        working-directory: backend
      - run: deploy/postgres/verify-roles.sh
