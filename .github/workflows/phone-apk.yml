name: Build phone APK

# Manual button (Actions → Build phone APK → Run workflow): builds the debug-signed test app pointed at
# the deployed server and offers it for download. No signing keys or secrets go into it; each run signs
# with a fresh debug key, so uninstall the previous copy before installing a new one.
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: Backend URL the app talks to (https only)
        default: https://fluteconsulatancy.com/
        required: true

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      API_URL: ${{ inputs.api_url }}
    steps:
      - name: URL is https
        run: |
          case "$API_URL" in https://*/) ;; *) echo "api_url must start with https:// and end with /"; exit 1 ;; esac
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :app:assembleDebug -Pvaultchat.apiBaseUrl.debug="$API_URL"
      - name: Name the APK and print its checksum
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/vaultchat-debug.apk
          sha256sum out/vaultchat-debug.apk | tee out/SHA256.txt
          echo "Built for $API_URL" >> out/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: vaultchat-debug-apk
          path: android/out/
          retention-days: 7
